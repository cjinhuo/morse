<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>English Typing Practice | Morse Typer</title>
    <meta name="description" content="Practice English sentences on your keyboard and track typing speed, accuracy and mistakes as you go." />
    <link rel="canonical" href="https://cjinhuo.github.io/morse/latin/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://cjinhuo.github.io/morse/latin/" />
    <meta property="og:title" content="English Typing Practice | Morse Typer" />
    <meta property="og:description" content="Practice English sentences on your keyboard and track typing speed, accuracy and mistakes as you go." />
    <meta property="og:image" content="https://raw.githubusercontent.com/cjinhuo/morse/master/docs/latin_play.png" />
    <meta property="og:image:alt" content="English Typing Practice in Morse Typer" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        if (localStorage.getItem('morse-theme') === 'light') document.documentElement.dataset.theme = 'light'
      } catch {}
      // Previous releases shared practice modes as hash URLs.
      const bookmark = location.hash.match(/^#\/(converter|latin)?\/?(\?[^#]*)?(#.*)?$/)
      if (bookmark) {
        const path = bookmark[1] ? bookmark[1] + '/' : ''
        location.replace('/morse/' + path + (bookmark[2] || location.search) + (bookmark[3] || ''))
      }
    </script>
  <link rel="icon" href="/morse/static/icons/favicon.svg" type="image/svg+xml"><script defer src="/morse/static/js/lib-react.d4fd20a0c3.js"></script><script defer src="/morse/static/js/lib-router.6fe6b4d3f1.js"></script><script defer src="/morse/static/js/y.e98d9c0020.js"></script><script defer src="/morse/static/js/8.de27f72b74.js"></script><script defer src="/morse/static/js/latin/index.4282a860b8.js"></script><link href="/morse/static/css/8.850decf38f.css" rel="stylesheet"></head>
  <body>
    <script>
      // Rsbuild adds the favicon link at the end of the head.
      const favicon = document.querySelector('link[rel="icon"]')
      if (favicon) {
        const darkIcon = favicon.href
        const lightIcon = new URL('favicon-light.svg', darkIcon).href
        const root = document.documentElement
        function syncBrandIcon() {
          const href = root.dataset.theme === 'light' ? lightIcon : darkIcon
          if (favicon.href !== href) favicon.href = href
          root.style.setProperty('--brand-icon', 'url("' + href + '")')
        }
        syncBrandIcon()
        new MutationObserver(syncBrandIcon).observe(root, { attributeFilter: ['data-theme'] })
      }
    </script>
    <div id="root">
      <main lang="en">
        <h1>English Typing Practice</h1>
        <p>Practice English sentences on your keyboard and track typing speed, accuracy and mistakes as you go.</p>
        <p>Type the highlighted character, then use the next sentence to start another practice round.</p>
        <nav aria-label="Practice modes">
          <a href="/morse/">Morse code typing practice</a>
          <a href="/morse/converter/">Text to Morse code converter</a>
          <a href="/morse/latin/">English typing practice</a>
        </nav>
      </main>
    </div>
  </body>
</html>
