<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><%= page.title %> | Morse Typer</title>
    <meta name="description" content="<%= page.description %>" />
    <link rel="canonical" href="<%= canonical %>" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="<%= canonical %>" />
    <meta property="og:title" content="<%= page.title %> | Morse Typer" />
    <meta property="og:description" content="<%= page.description %>" />
    <meta property="og:image" content="https://raw.githubusercontent.com/cjinhuo/morse/master/docs/<%= page.image %>" />
    <meta property="og:image:alt" content="<%= page.title %> in Morse Typer" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        if (localStorage.getItem('morse-theme') === 'light') document.documentElement.dataset.theme = 'light'
      } catch {}
      // Previous releases shared practice modes as hash URLs.
      const bookmark = location.hash.match(/^#\/(converter|latin)?\/?(\?[^#]*)?(#.*)?$/)
      if (bookmark) {
        const path = bookmark[1] ? bookmark[1] + '/' : ''
        location.replace('/morse/' + path + (bookmark[2] || location.search) + (bookmark[3] || ''))
      }
    </script>
  </head>
  <body>
    <script>
      // Rsbuild adds the favicon link at the end of the head.
      const favicon = document.querySelector('link[rel="icon"]')
      if (favicon) {
        const darkIcon = favicon.href
        const lightIcon = new URL('favicon-light.svg', darkIcon).href
        const root = document.documentElement
        function syncFavicon() {
          const href = root.dataset.theme === 'light' ? lightIcon : darkIcon
          if (favicon.href !== href) favicon.href = href
        }
        syncFavicon()
        new MutationObserver(syncFavicon).observe(root, { attributeFilter: ['data-theme'] })
      }
    </script>
    <div id="root">
      <main lang="en">
        <h1><%= page.title %></h1>
        <p><%= page.description %></p>
        <p><%= page.example %></p>
        <nav aria-label="Practice modes">
          <a href="/morse/">Morse code typing practice</a>
          <a href="/morse/converter/">Text to Morse code converter</a>
          <a href="/morse/latin/">English typing practice</a>
        </nav>
      </main>
    </div>
  </body>
</html>
