name: github pages

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify published pages
        run: |
          test -s dist/index.html
          test -s dist/converter/index.html
          test -s dist/latin/index.html
          test -s dist/sitemap.xml
      - name: Deploy dist
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.CI_TOKEN }}
          publish_dir: ./dist
